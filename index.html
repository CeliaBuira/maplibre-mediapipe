<!DOCTYPE html>
<html lang="en">

<head>
    <title>Display a map</title>
    <meta property="og:description" content="Initialize a map in an HTML element with MapLibre GL JS." />
    <meta property="og:category" content="Getting Started" />
    <meta property="og:order" content="1" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@6.14.0/dist/maplibre-gl.css' />

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #map {
            height: 100%;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 1rem;
        }

        button {
            padding: .6rem 1.1rem;
            font-size: 1rem;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: wait;
        }

        #status {
            margin: .75rem 0;
            color: #9ca3af;
        }


        .stage {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: inline-block;
            width: clamp(180px, 22vw, 360px);
            aspect-ratio: 4 / 3;
            
            border-radius: 20px;
            overflow: hidden;
        }

        #video,
        #overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            /* mirror: true; */
        }

        /* map { width: 150px; height: 100px; } */
    </style>
</head>

<body>
    <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>
    <div id="map"></div>

    <script type="module" src="/src/main.ts"></script>

</body>

</html>
